<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Lab 02 Cipher{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --ink: #172033;
            --muted: #62708a;
            --line: #d9e1ee;
            --brand: #0f766e;
            --brand-dark: #115e59;
            --panel: #ffffff;
            --danger: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--bg);
            font-family: Arial, Helvetica, sans-serif;
        }

        .layout {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            min-height: 100vh;
        }

        aside {
            background: #14213d;
            color: #fff;
            padding: 22px 16px;
        }

        .brand {
            display: block;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
        }

        nav {
            display: grid;
            gap: 6px;
        }

        nav a {
            color: #dce8ff;
            padding: 10px 12px;
            border-radius: 6px;
            text-decoration: none;
        }

        nav a:hover,
        nav a.active {
            background: rgba(255, 255, 255, 0.13);
            color: #fff;
        }

        main {
            padding: 30px;
        }

        .page-head {
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            color: var(--muted);
            margin: 0;
            line-height: 1.5;
        }

        .tool {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
            max-width: 860px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--ink);
            font: inherit;
            background: #fff;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        button {
            border: 0;
            border-radius: 6px;
            background: var(--brand);
            color: #fff;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--brand-dark);
        }

        .result,
        .error,
        .matrix {
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #f8fafc;
            overflow-wrap: anywhere;
        }

        .error {
            color: var(--danger);
            border-color: #f0b8b1;
            background: #fff5f5;
        }

        .matrix table {
            border-collapse: collapse;
        }

        .matrix td {
            width: 42px;
            height: 38px;
            text-align: center;
            border: 1px solid var(--line);
            font-weight: 700;
            background: #fff;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            max-width: 980px;
        }

        .card {
            display: block;
            min-height: 120px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            text-decoration: none;
            color: var(--ink);
            background: #fff;
        }

        .card strong {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .card span {
            color: var(--muted);
            line-height: 1.45;
        }

        @media (max-width: 760px) {
            .layout {
                grid-template-columns: 1fr;
            }

            aside {
                position: static;
            }

            main {
                padding: 18px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside>
            <a class="brand" href="/">Lab 02 Cipher</a>
            <nav>
                <a href="/caesar" class="{{ 'active' if request.path == '/caesar' else '' }}">Caesar Cipher</a>
                <a href="/vigenere" class="{{ 'active' if request.path == '/vigenere' else '' }}">Vigenere Cipher</a>
                <a href="/railfence" class="{{ 'active' if request.path == '/railfence' else '' }}">Rail Fence Cipher</a>
                <a href="/playfair" class="{{ 'active' if request.path == '/playfair' else '' }}">Playfair Cipher</a>
                <a href="/transposition" class="{{ 'active' if request.path == '/transposition' else '' }}">Transposition Cipher</a>
            </nav>
        </aside>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
